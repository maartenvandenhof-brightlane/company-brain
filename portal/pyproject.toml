[project]
name = "portal"
version = "0.1.0"
description = "Owner portal for Second Brain: wiki reader, docs, endpoint dashboard and provider keys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.5,<3",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<0.6",
    "nh3>=0.3,<0.4",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3,<7",
    "starlette>=1.0,<2",
    "uvicorn>=0.54,<1",
    # owner credential checks, rate limiting, audit log, trusted-proxy client IP and the
    # access-mode URL rules are shared with wiki-mcp rather than duplicated
    "wiki-mcp",
]

[project.scripts]
portal = "portal.__main__:main"

[tool.uv.sources]
wiki-mcp = { path = "../wiki-mcp" }

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]
# S101: asserts guard internal invariants. E501: `ruff format` owns line length.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "ASYNC110", "ASYNC221", "RUF059"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["portal"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
